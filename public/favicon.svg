<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="cyber-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="100" height="100" rx="24" fill="#070b14" />
  <rect x="2" y="2" width="96" height="96" rx="22" stroke="url(#cyber-grad)" stroke-width="2.5" stroke-opacity="0.8" />
  <!-- Hexagon outline -->
  <polygon points="50,16 80,33 80,67 50,84 20,67 20,33" stroke="url(#cyber-grad)" stroke-width="3" fill="#0c1220" />
  <!-- Monogram LN -->
  <text x="50" y="58" font-family="'Inter', system-ui, sans-serif" font-size="28" font-weight="900" fill="url(#cyber-grad)" text-anchor="middle" letter-spacing="1">LN</text>
  <circle cx="50" cy="72" r="3" fill="#06b6d4" filter="url(#glow)" />
</svg>
